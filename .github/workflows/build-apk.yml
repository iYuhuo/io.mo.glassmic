name: Build APK (feature/floating-controls)

on:
  push:
    branches: [ "feature/floating-controls" ]

jobs:
  build:
    name: Build debug APK (with diagnostics)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install packages (unzip, wget)
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Download Android command-line tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT
          cd $ANDROID_SDK_ROOT
          # download commandlinetools (versioned URL may be updated over time)
          wget -qO cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          rm cmdline-tools.zip
          # move/rename to "latest" so sdkmanager path is stable
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true

      - name: Install Android SDK components (platform-tools, platforms, build-tools, NDK)
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;30.0.14904198"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=${ANDROID_SDK_ROOT}

      - name: Print environment
        run: |
          java -version || true
          javac -version || true
          ./gradlew -v || true
          df -h || true
          ls -la $ANDROID_SDK_ROOT || true

      - name: sdkmanager list
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list --sdk_root=${ANDROID_SDK_ROOT} > sdk-list.txt || true
          cat sdk-list.txt || true
        continue-on-error: true

      - name: Write local.properties for SDK/NDK
        run: |
          cat > local.properties <<EOF
          sdk.dir=/usr/local/lib/android/sdk
          ndk.dir=/usr/local/lib/android/sdk/ndk/30.0.14904198
          EOF

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/30.0.14904198" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Clean and build (force)
        run: |
          ./gradlew clean :app:assembleDebug --no-daemon --stacktrace --info | tee gradle-build.log
        continue-on-error: true

      - name: List app build outputs
        run: |
          echo "---- list app/build/outputs ----"
          ls -la app/build/outputs || true
          echo "---- find apk files ----"
          find app/build/outputs -type f -name "*.apk" -print || true

      - name: Upload build logs and any apks
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            gradle-build.log
            sdk-list.txt
            app/build/outputs/**/*.apk
            app/build
