name: 构建 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'iYuhuo/io.mo.glassmic'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出本次提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Java 17 和 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: 安装项目要求的 SDK 和原生工具链
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: 编译 Kotlin 并打包 Debug / Release
        run: bash ./gradlew :app:compileDebugKotlin :xposed:compileDebugKotlin :app:assembleDebug :app:assembleRelease --no-daemon --console=plain

      - name: 执行音频与回调时序回归检查
        run: |
          set -euo pipefail
          stdlib=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib" -name 'kotlin-stdlib-*.jar' ! -name '*sources*' ! -name '*javadoc*' | sort -V | tail -1)
          test -n "$stdlib"
          mkdir -p build/audio-regression
          classpath="app/build/tmp/kotlin-classes/debug:xposed/build/tmp/kotlin-classes/debug:$stdlib:build/audio-regression"
          javac -encoding UTF-8 -cp "$classpath" -d build/audio-regression tests/audio/AudioRegression.java tests/audio/TapTimingRegression.java
          java -cp "$classpath" AudioRegression
          java -cp "$classpath" TapTimingRegression

      - name: 整理产物（可选正式签名）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          version_code=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionCode"])')
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/yuhuo-$version-debug.apk"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] \
            && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            umask 077
            keystore=$(mktemp "$RUNNER_TEMP/yuhuo-signing-XXXXXX")
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            apk="dist/yuhuo-$version-release.apk"
            "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/yuhuo-aligned.apk"
            "$tools/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "$apk" \
              "$RUNNER_TEMP/yuhuo-aligned.apk"
            "$tools/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
            "$tools/zipalign" -c -P 16 4 "$apk"
            (cd dist && sha256sum "yuhuo-$version-release.apk" "yuhuo-$version-debug.apk" > SHA256SUMS.txt)
            echo "signed=true" >> "$GITHUB_STEP_SUMMARY"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/yuhuo-$version-release-unsigned.apk"
            (cd dist && sha256sum "yuhuo-$version-debug.apk" "yuhuo-$version-release-unsigned.apk" > SHA256SUMS.txt)
            echo "signed=false (missing ANDROID_KEYSTORE_* secrets; uploaded debug + unsigned release)" >> "$GITHUB_STEP_SUMMARY"
          fi

          printf 'versionName=%s\nversionCode=%s\ncommit=%s\nworkflow=%s/%s/actions/runs/%s\n' \
            "$version" "$version_code" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/build-info.txt

      - name: 上传安装包与校验值
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yuhuo-apk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
