name: 构建 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'iYuhuo/io.mo.glassmic'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出本次提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Java 17 和 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: 安装项目要求的 SDK 和原生工具链
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: 编译 Kotlin 并打包 Debug / Release
        run: bash ./gradlew :app:compileDebugKotlin :xposed:compileDebugKotlin :app:assembleDebug :app:assembleRelease --no-daemon --console=plain

      - name: 执行音频与回调时序回归检查
        run: |
          set -euo pipefail
          stdlib=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib" -name 'kotlin-stdlib-*.jar' ! -name '*sources*' ! -name '*javadoc*' | sort -V | tail -1)
          test -n "$stdlib"
          mkdir -p build/audio-regression
          classpath="app/build/tmp/kotlin-classes/debug:xposed/build/tmp/kotlin-classes/debug:$stdlib:build/audio-regression"
          javac -encoding UTF-8 -cp "$classpath" -d build/audio-regression tests/audio/AudioRegression.java tests/audio/TapTimingRegression.java
          java -cp "$classpath" AudioRegression
          java -cp "$classpath" TapTimingRegression

      - name: 整理产物（debug / release 同一签名）
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          version_code=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionCode"])')
          mkdir -p dist
          # Gradle 已用 debug keystore 同时签 debug 与 release，可直接覆盖安装
          cp app/build/outputs/apk/debug/app-debug.apk "dist/yuhuo-$version-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/yuhuo-$version-release.apk"
          (cd dist && sha256sum "yuhuo-$version-debug.apk" "yuhuo-$version-release.apk" > SHA256SUMS.txt)
          printf 'versionName=%s\nversionCode=%s\nsigning=debug-keystore\ncommit=%s\nworkflow=%s/%s/actions/runs/%s\n' \
            "$version" "$version_code" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/build-info.txt
          echo "debug/release both signed with Android debug keystore" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传安装包与校验值
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yuhuo-apk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
