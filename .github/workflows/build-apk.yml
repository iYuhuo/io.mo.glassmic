name: Build APK (feature/floating-controls)

on:
  push:
    branches: [ "feature/floating-controls" ]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install packages (unzip, wget)
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Download Android command-line tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT
          cd $ANDROID_SDK_ROOT
          wget -qO cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          rm cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true

      - name: Install Android SDK components (with stable NDK 27.1.12297006)
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=${ANDROID_SDK_ROOT}

      - name: Write local.properties for SDK/NDK
        run: |
          cat > local.properties <<EOF
          sdk.dir=/usr/local/lib/android/sdk
          ndk.dir=/usr/local/lib/android/sdk/ndk/27.1.12297006
          EOF

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Clean and build
        run: |
          ./gradlew clean :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee gradle-build.log

      - name: Check for APK
        if: always()
        run: |
          echo "Searching for APK files..."
          if find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null; then
            echo "✅ APK found!"
          else
            echo "❌ APK not found"
            echo "Build outputs directory structure:"
            find app/build/outputs -type d 2>/dev/null | head -20 || echo "No outputs found"
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: gradle-build.log
          retention-days: 7
