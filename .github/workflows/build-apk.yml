name: Build APK (feature/floating-controls)

on:
  push:
    branches: [ "feature/floating-controls" ]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install packages (unzip, wget)
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Download Android command-line tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT
          cd $ANDROID_SDK_ROOT
          wget -qO cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          rm cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true

      - name: Install Android SDK components (with stable NDK 27.1.12297006)
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=${ANDROID_SDK_ROOT}

      - name: Write local.properties for SDK/NDK
        run: |
          cat > local.properties <<EOF
          sdk.dir=/usr/local/lib/android/sdk
          ndk.dir=/usr/local/lib/android/sdk/ndk/27.1.12297006
          EOF
          cat local.properties

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME is set to: /usr/local/lib/android/sdk/ndk/27.1.12297006"

      - name: Verify NDK installation
        run: |
          ls -la /usr/local/lib/android/sdk/ndk/27.1.12297006/ || echo "NDK directory not found"
          which clang || echo "clang not in PATH"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Gradle build with verbose output
        run: |
          ./gradlew clean :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --debug \
            -Dorg.gradle.logging.level=debug \
            2>&1 | tee -a gradle-build.log
          BUILD_EXIT=$?
          echo "Build exit code: $BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Build failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi

      - name: Check Gradle build output directory structure
        if: always()
        run: |
          echo "=== app/build directory structure ==="
          find app/build -type d -name "apk" 2>/dev/null | head -20 || echo "No apk directories found"
          echo ""
          echo "=== app/build/outputs structure ==="
          find app/build/outputs -type f 2>/dev/null | head -30 || echo "outputs directory empty or missing"
          echo ""
          echo "=== Looking for all .apk files ==="
          find app/build -name "*.apk" -type f 2>/dev/null || echo "No APK files found anywhere"

      - name: List xposed module outputs
        if: always()
        run: |
          echo "=== xposed/build outputs ==="
          find xposed/build -name "*.so" -o -name "*.aar" 2>/dev/null | head -20 || echo "No xposed outputs"

      - name: Extract last 100 lines of build log
        if: always()
        run: |
          echo "=== Last 100 lines of gradle-build.log ==="
          tail -100 gradle-build.log

      - name: Search for errors in build log
        if: always()
        run: |
          echo "=== Searching for ERROR/FAILED keywords ==="
          grep -i "ERROR\|FAILED\|Exception" gradle-build.log | head -50 || echo "No ERROR/FAILED keywords found"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: gradle-build.log
          retention-days: 7

      - name: Upload APK if exists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
