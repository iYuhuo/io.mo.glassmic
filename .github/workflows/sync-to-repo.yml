name: Sync to Xposed-Modules-Repo

on:
  push:
    branches: [main]

jobs:
  sync:
    # 仅上游官方仓库同步到 Xposed-Modules-Repo；yuhuo 镜像禁用。
    if: github.repository == 'lm060719/io.mo.glassmic'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Push to target repo
        run: |
          git remote add target https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/Xposed-Modules-Repo/io.mo.glassmic.git
          git push target main --force
